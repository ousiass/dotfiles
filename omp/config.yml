modelRoles:
  default: anthropic/claude-sonnet-5-5:high
  task: anthropic/claude-sonnet-5-5:high
  slow: anthropic/claude-opus-5-5:high
  plan: anthropic/claude-sonnet-5-5:high
  advisor: anthropic/claude-sonnet-5-5:high
  smol: openai-codex/gpt-6-luna:medium
  tiny: openai-codex/gpt-6-luna:medium
  commit: openai-codex/gpt-6-luna:medium
  vision: anthropic/claude-sonnet-5-5:high
task:
  showResolvedModelBadge: true
  enableLsp: true
  softRequestBudget: 400
  agentModelOverrides:
    scout: "@smol"
    sonic: "@commit"
    task: "@task"
    reviewer: "@task"
    security-reviewer: "@task"
advisor:
  enabled: true
compaction:
  thresholdPercent: 50
retry:
  fallbackChains:
    default:
      - cursor/claude-sonnet-5-high
      - cursor/grok-4.7-high
    task:
      - cursor/claude-sonnet-5-high
      - cursor/grok-4.7-high
    advisor:
      - cursor/claude-sonnet-5-high
    smol:
      - cursor/grok-4.7-low-fast
      - cursor/claude-sonnet-5-low
    tiny:
      - cursor/grok-4.7-low-fast
      - cursor/claude-sonnet-5-low
    commit:
      - cursor/grok-4.7-low-fast
      - cursor/claude-sonnet-5-low
    slow:
      []
providers:
  maxInFlightRequests:
    anthropic: 3
symbolPreset: nerd
statusLine:
  preset: nerd
display:
  pinnedAgents: collapsed
hideThinkingBlock: true
textVerbosity: low
skills:
  enableClaudeUser: true
setupVersion: 2
dev:
  autoqaConsent: granted
claudeResets:
  autoRedeem: "no"