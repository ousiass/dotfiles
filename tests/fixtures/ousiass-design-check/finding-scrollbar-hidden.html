<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>
:root{--ink:#050505;--bone:#f5f5f4;--mute:#6b6b6e}
.sb{overflow:auto;width:240px;height:120px;border:1px solid #e7e7e5}
.sb .inner{width:600px;height:400px}
/* バーを隠す。スクロール自体はできるが、見えない・操作が分かりにくい（B6） */
.sb{scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
</style></head><body>
<div class="sb" id="sb" tabindex="0" role="region" aria-label="縦横スクロールの見本"><div class="inner"></div></div>
</body></html>
