<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>
:root{--ink:#050505;--bone:#f5f5f4;--mute:#6b6b6e}
.sb{overflow:auto;width:240px;height:120px;border:1px solid #e7e7e5}
.sb .inner{width:600px;height:400px}
/* range スライダーの値（トラック 4px・つまみ 16px）をスクロールバーに流用（B5） */
@media (forced-colors:none){
@supports selector(::-webkit-scrollbar){
.sb{scrollbar-width:auto;scrollbar-color:auto}
.sb::-webkit-scrollbar{width:16px;height:4px}
.sb::-webkit-scrollbar-thumb{background:var(--ink);border-radius:999px}
}}
</style></head><body>
<div class="sb" id="sb" tabindex="0" role="region" aria-label="縦横スクロールの見本"><div class="inner"></div></div>
</body></html>
