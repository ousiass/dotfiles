<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>
:root{--ink:#050505;--bone:#f5f5f4;--mute:#6b6b6e}
.sb{overflow:auto;width:240px;height:120px;border:1px solid #e7e7e5}
.sb .inner{width:600px;height:400px}
/* 正本 5d816f8 tokens-preview.html#scrollbar と同じ指定（縦横両方向・優先関係・forced-colors 限定） */
:root{--sb-size:8px;--sb-thumb:var(--mute);--sb-thumb-hover:color-mix(in srgb,var(--ink) 35%,var(--mute));--sb-thumb-active:color-mix(in srgb,var(--ink) 65%,var(--mute))}
@media (forced-colors:none){
.sb{scrollbar-width:thin;scrollbar-color:var(--sb-thumb) transparent}
@supports selector(::-webkit-scrollbar){
.sb{scrollbar-width:auto;scrollbar-color:auto}
.sb::-webkit-scrollbar{width:var(--sb-size);height:var(--sb-size)}
.sb::-webkit-scrollbar-track,.sb::-webkit-scrollbar-corner{background:transparent}
.sb::-webkit-scrollbar-button{display:none;width:0;height:0}
.sb::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:999px}
.sb::-webkit-scrollbar-thumb:hover{background:var(--sb-thumb-hover)}
.sb::-webkit-scrollbar-thumb:active{background:var(--sb-thumb-active)}
}}
</style></head><body>
<div class="sb" id="sb" tabindex="0" role="region" aria-label="縦横スクロールの見本"><div class="inner"></div></div>
</body></html>
